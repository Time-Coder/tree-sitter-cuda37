[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-cuda37"
description = "CUDA grammar for tree-sitter (Python 3.7 compatible build)"
version = "0.21.4"
keywords = ["incremental", "parsing", "tree-sitter", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
]
authors = [
  { name = "Stephan Seitz" },
  { name = "Time-Coder" },
]
requires-python = ">=3.7"
license.text = "MIT"
readme = "README.md"

# A runtime dependency, not an extra: `tree_sitter_cuda37/__init__.py` imports
# tree_sitter at module scope, so plain `pip install tree-sitter-cuda37` has to
# pull it. Shipping it only as the `core` extra made the install succeed and the
# import fail with ModuleNotFoundError -- the same defect tree-sitter-metal 0.1.0
# had.
dependencies = ["tree-sitter>=0.20"]

[project.urls]
Homepage = "https://github.com/Time-Coder/tree-sitter-cuda37"
Upstream = "https://github.com/tree-sitter-grammars/tree-sitter-cuda"

# `core` stays as a no-op alias so `pip install tree-sitter-cuda37[core]`
# keeps resolving for anyone who spelled the extra.
[project.optional-dependencies]
core = ["tree-sitter>=0.20"]

# cp37 is the target of this distribution; older cibuildwheel config that only
# built cp310 wheels is intentionally removed.
[tool.cibuildwheel]
build = "cp37-*"
build-frontend = "build"
test-requires = ["tree-sitter>=0.20"]
